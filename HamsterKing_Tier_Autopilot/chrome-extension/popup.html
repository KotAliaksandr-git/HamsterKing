<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamster King Tier Autopilot</title><link rel="stylesheet" href="popup.css"></head><body><main><header><span class="eyebrow">SCREEN-BASED AUTOMATION</span><h1>Hamster King</h1><p>Tier Autopilot <span class="version">v1.20</span></p></header><div id="status" class="status">Ready</div><section class="settings"><label>Run mode<select id="mode"><option value="up-one-tier">Up one tier per building</option><option value="one">One building (selected target)</option><option value="five">Up to five (selected target)</option><option value="all" selected>All visible (selected target)</option><option value="check">Marker check only</option><option value="resume2">Resume from Tier 2</option></select></label><label id="targetLabel">Target tier<select id="target"><option value="tier4plus">Tier 4+</option><option value="tier5">Tier 5</option><option value="tier5plus" selected>Tier 5+</option></select></label><details><summary>Timeout settings</summary><div class="grid"><label>Max buildings<input id="maxBuildings" type="number" min="1" max="1000"></label><label>Panel seconds<input id="panelTimeoutSeconds" type="number" min="1"></label><label>State seconds<input id="stateTimeoutSeconds" type="number" min="1"></label><label>Fight seconds<input id="fightTimeoutSeconds" type="number" min="1"></label><button id="save" class="secondary">Save settings</button></div></details></section><section class="controls"><button id="start" class="primary">Start (paused)</button><button id="resume" class="secondary">Resume</button><button id="pause" class="secondary">Pause</button><button id="stop" class="danger">Emergency stop</button></section><div class="meta"><span id="progress">No run started</span><span id="runName"></span></div><section class="log"><b>RUN LOG</b><pre id="lines">Select the game tab, then start a run. It begins paused.</pre></section><section id="downloads"></section><footer>Visible-tab screenshots and guarded clicks only. Do not move the map while running.</footer></main><script src="popup.js"></script></body></html>
